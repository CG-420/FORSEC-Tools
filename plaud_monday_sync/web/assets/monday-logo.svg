    <line x1="16" y1="76" x2="38" y2="26" stroke="#F62B54"/>
    <line x1="56" y1="76" x2="78" y2="26" stroke="#FFCB00"/>
  </g>
  <circle cx="104" cy="66" r="11" fill="#00CA72"/>
  <text x="132" y="72" font-family="Trebuchet MS, Verdana, Arial, sans-serif"
